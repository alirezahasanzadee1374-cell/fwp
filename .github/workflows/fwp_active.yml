name: FWP Bot - Active Positions

on:
  # کرون داخلی گیت‌هاب (پشتیبان) — هر ۵ دقیقه
  schedule:
    - cron: '*/5 * * * *'
  # اجرای دستی + cron-job.org
  workflow_dispatch: {}

concurrency:
  group: fwp-active
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-fwp-active:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FWP active_only
        run: python main.py active_only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}

      - name: Commit state
        if: always()
        run: |
          git config --local user.email "fwp-bot@users.noreply.github.com"
          git config --local user.name "FWP Bot"
          git add state.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "FWP active state update [skip ci]"
          git push || true

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fwp-active-logs
          path: |
            *.log
          retention-days: 7
