name: LPD - Active Scan

on:
  schedule:
    # اسکن سریع لیست ۲۰ تایی هر ۲ دقیقه
    - cron: '*/2 * * * *'
  workflow_dispatch:

concurrency:
  group: lpd-active
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-lpd-active:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LPD Active Scan
        run: python -m lpd.main_lpd active
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}

      - name: Commit LPD State
        if: always()
        run: |
          git config --local user.email "fwp-bot@users.noreply.github.com"
          git config --local user.name "FWP Bot"
          git add lpd_state.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "LPD active state update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main 2>/dev/null && git push 2>/dev/null && break
            sleep 2
          done
